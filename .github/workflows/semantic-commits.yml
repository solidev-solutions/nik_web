name: Semantic Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Semantic Commits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true

      # commitlint comes from the lockfile of the release tools, with the preset the release uses.
      - name: Install commitlint
        working-directory: .github/release
        run: npm ci --ignore-scripts

      # A pull request is squashed into one commit on develop, and that commit takes its title.
      # The commits inside the pull request are discarded, so only the title is checked.
      - name: Check pull request title
        working-directory: .github/release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint --verbose
