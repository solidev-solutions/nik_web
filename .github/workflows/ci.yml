name: CI

on:
  push:
    branches:
      - develop
  pull_request:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: develop-nik_web-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server

    env:
      # Frappe cuts each weekly release from version-16-hotfix. The nightly run
      # tests against it, every other run against what is already released.
      UPSTREAM_BRANCH: ${{ github.event_name == 'schedule' && 'version-16-hotfix' || 'version-16' }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$UPSTREAM_BRANCH" --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app nik_web $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app nik_web
          bench build

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app nik_web

      - name: Migrate
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site migrate

      - name: Uninstall
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site uninstall-app nik_web --yes --no-backup
          bench --site test_site list-apps
          # uninstall-app also exits with 0 when it refuses to remove the app
          if bench --site test_site list-apps | grep -q nik_web; then exit 1; fi
