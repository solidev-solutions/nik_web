exclude: 'node_modules'
default_stages: [pre-commit]
fail_fast: false
default_language_version:
  node: system


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "nik_web.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
        # Search for conflict markers on every run. By default the hook only searches while git is merging.
        args: [--assume-in-merge]
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  # The prettier mirror of pre-commit is archived, so the hook is defined here.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: prettier --write --ignore-unknown
        additional_dependencies: ["prettier@3.9.10"]
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nik_web/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nik_web/templates/includes/.*|
                nik_web/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.15.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # eslint.config.js loads the last two packages.
        additional_dependencies: ["eslint@10.15.0", "@eslint/js@10.0.1", "globals@17.14.0"]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nik_web/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nik_web/templates/includes/.*|
                nik_web/public/js/lib/.*
            )$

  - repo: local
    hooks:
      - id: no-docs
        name: "No documentation files"
        language: fail
        entry: "No docs/ folder. Markdown is limited to README.md, SECURITY.md, AGENTS.md, CLAUDE.md, .claude/skills/ and notification templates."
        files: '^docs/|\.md$'
        exclude: |
            (?x)^(
                (README|SECURITY|AGENTS|CLAUDE)\.md|
                \.claude/skills/.*|
                nik_web/[^/]+/notification/.*
            )$

      - id: no-local-stack
        name: "No local stack files"
        language: fail
        entry: "The local Docker stack stays outside this repository."
        files: |
            (?x)(^|/)(
                (docker-)?compose(\.[^/]+)?\.ya?ml|
                Dockerfile(\.[^/]+)?|
                \.devcontainer/.*
            )$

      - id: doctype-prefix
        name: "DocTypes carry the NW prefix"
        language: fail
        entry: "Own DocTypes start with NW, for example NW Page."
        files: '^nik_web/[^/]+/doctype/(?!nw_)[^/]+/'

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
